<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CUTZ</title>
<style>
/* ===== PASTE INTO YOUR CSS ===== */
:root{--img:url('hero-image.png')}   /* path is relative to the file this CSS lives in */
body{margin:0;background:#050403;font-family:system-ui,sans-serif}

.hero{position:relative;min-height:100svh;display:flex;align-items:center;overflow:hidden;background:#050403}
.hero-bg{position:absolute;inset:0;container-type:size;z-index:0}
.stage{position:absolute;right:0;top:50%;transform:translateY(-50%);
  width:max(100cqw,200cqh);aspect-ratio:1774/887}
.hero-content{position:relative;z-index:2;max-width:560px;padding:0 clamp(20px,6vw,90px)}
.hero h1{margin:0 0 18px;font-size:clamp(44px,7vw,96px);line-height:.95;color:#fff;font-weight:800}
.hero p{margin:0 0 28px;color:#d8c9bb;font-size:1.1rem;line-height:1.5}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap}
.btn{padding:14px 26px;border-radius:999px;background:#ff7a1a;color:#120a04;font-weight:700;text-decoration:none}
.btn-outline{background:transparent;color:#ffb066;border:1.5px solid #ff7a1a}

/* animation layers */
.world{position:absolute;inset:0;transform-origin:70% 45%;animation:drift 24s ease-in-out infinite alternate}
@keyframes drift{from{transform:scale(1)}to{transform:scale(1.05) translate(-.8%,.4%)}}
.base,.glow{position:absolute;inset:0}
.base{background:var(--img) center/cover;filter:brightness(.22) saturate(.8)}
.piece{position:absolute;background-image:var(--img);background-repeat:no-repeat;will-change:transform,opacity;
 -webkit-mask-image:linear-gradient(to right,transparent,#000 10%,#000 90%,transparent),linear-gradient(to bottom,transparent,#000 10%,#000 90%,transparent);
 -webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent,#000 10%,#000 90%,transparent),linear-gradient(to bottom,transparent,#000 10%,#000 90%,transparent);mask-composite:intersect}
.glow{opacity:0;mix-blend-mode:screen;pointer-events:none}
.spot{background:radial-gradient(circle at 92.5% 10.5%,rgba(255,170,70,.75),rgba(255,120,20,.25) 12%,transparent 30%)}
.screen{background:radial-gradient(ellipse at 73% 30%,rgba(255,150,60,.35),transparent 28%)}
.flash{position:absolute;left:70%;top:58%;width:30%;aspect-ratio:1;margin:-15% 0 0 -15%;border-radius:50%;opacity:0;pointer-events:none;
 background:radial-gradient(circle,rgba(255,200,120,.9),rgba(255,120,20,.3) 40%,transparent 70%);mix-blend-mode:screen}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 65% 45%,transparent 45%,rgba(0,0,0,.55));pointer-events:none}
/* ===== END CSS ===== */
</style>
</head>
<body>

<!-- ===== PASTE THIS REPLACING YOUR WHOLE HERO ===== -->
<main>
  <section class="hero" id="hero">

    <!-- animated background -->
    <div class="hero-bg" aria-hidden="true">
      <div class="stage">
        <div class="world">
          <div class="base" id="base"></div>
          <div id="pieces"></div>
          <div class="glow screen" id="g1"></div>
          <div class="glow spot" id="g2"></div>
          <div class="flash" id="flash"></div>
          <canvas id="c"></canvas>
        </div>
        <div class="vig"></div>
      </div>
    </div>

    <!-- your text, on top -->
    <div class="hero-content">
      <h1>WE CREATE.<br>YOU GROW.</h1>
      <p>CUTZ is a creative digital agency helping brands grow through creativity and digital marketing.</p>
      <div class="hero-actions">
        <a class="btn" href="#contact">Start a project</a>
        <a class="btn btn-outline" href="#work">See our work</a>
      </div>
    </div>

  </section>
</main>
<!-- ===== END HERO ===== -->

<!-- ===== PASTE JUST BEFORE </body> ===== -->
<script>
const IW=1774,IH=887;
// x,y,w,h in source px; from = start transform; d = delay (s); t = duration (s)
const PARTS=[
 {n:'laptop',x:640,y:312,w:480,h:275,from:'translate(-70%,10%) rotate(-6deg) scale(.9)',d:.2,t:.9},
 {n:'tablet',x:645,y:580,w:510,h:115,from:'translate(0,150%) scale(.9)',d:.5,t:.8},
 {n:'monitor',x:1075,y:100,w:455,h:345,from:'translate(0,28%) scale(.45)',d:.95,t:1.0,pop:1,origin:'50% 100%'},
 {n:'body',x:1155,y:382,w:240,h:235,from:'translate(60%,-90%) rotate(10deg) scale(.8)',d:1.7,t:.8},
 {n:'lens',x:1020,y:436,w:245,h:178,from:'translate(-110%,10%) rotate(-12deg) scale(.85)',d:1.95,t:.8},
 {n:'barrel',x:1395,y:486,w:130,h:168,from:'translate(40%,110%) rotate(18deg)',d:2.2,t:.7},
 {n:'cup',x:1485,y:396,w:115,h:184,from:'translate(0,-120%)',d:2.35,t:.6},
 {n:'drone',x:1510,y:550,w:264,h:125,from:'translate(120%,0) rotate(8deg)',d:2.45,t:.7},
 {n:'clap',x:1145,y:660,w:505,h:160,from:'translate(0,-260%) rotate(-14deg)',d:2.6,t:.85,bounce:1},
 {n:'photos',x:1495,y:705,w:279,h:182,from:'translate(40%,60%) rotate(6deg)',d:2.9,t:.7},
 {n:'lamp',x:1545,y:20,w:175,h:160,from:'translate(0,-120%) scale(.8)',d:3.1,t:.7}
];
const host=document.getElementById('pieces');
const els=PARTS.map(p=>{const e=document.createElement('div');e.className='piece';
 Object.assign(e.style,{left:p.x/IW*100+'%',top:p.y/IH*100+'%',width:p.w/IW*100+'%',height:p.h/IH*100+'%',
  backgroundSize:IW/p.w*100+'% '+IH/p.h*100+'%',backgroundPosition:(p.x/(IW-p.w)*100)+'% '+(p.y/(IH-p.h)*100)+'%',
  transformOrigin:p.origin||'50% 50%'});
 host.appendChild(e);return e});
const base=document.getElementById('base'),g1=document.getElementById('g1'),g2=document.getElementById('g2'),flash=document.getElementById('flash');
let anims=[];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function run(){
 anims.forEach(a=>a.cancel());anims=[];
 const A=(el,kf,o)=>{const a=el.animate(kf,{fill:'both',...o});anims.push(a);return a};
 base.style.filter='';
 if(reduce){base.style.filter='none';g1.style.opacity=g2.style.opacity=1;return}
 A(base,[{filter:'brightness(.22) saturate(.8)'},{filter:'brightness(.22) saturate(.8)',offset:.78},{filter:'brightness(1) saturate(1)'}],{duration:4200,easing:'ease-out'});
 PARTS.forEach((p,i)=>{
  const ease=p.pop?'cubic-bezier(.2,1.5,.4,1)':'cubic-bezier(.22,1.25,.36,1)';
  const kf=[{transform:p.from,opacity:0,filter:'brightness(2.2)'},{opacity:1,offset:.35},{transform:'none',opacity:1,filter:'brightness(1)'}];
  A(els[i],kf,{duration:p.t*1000,delay:p.d*1000,easing:ease});
 });
 // snap flash when the camera locks together
 A(flash,[{opacity:0,transform:'scale(.3)'},{opacity:.9,transform:'scale(1)',offset:.3},{opacity:0,transform:'scale(1.4)'}],{duration:700,delay:2750});
 // monitor pop shockwave
 A(g1,[{opacity:0},{opacity:1}],{duration:900,delay:3300});
 A(g2,[{opacity:0},{opacity:1}],{duration:900,delay:3300});
}
// ambient: lamp flicker + screen pulse, run on inner glow strength
g1.style.animation='pulse 3.5s ease-in-out infinite';
const st=document.createElement('style');
st.textContent='@keyframes pulse{0%,100%{filter:brightness(.6)}50%{filter:brightness(1.4)}}@keyframes flick{0%,100%{filter:brightness(.8)}8%{filter:brightness(1.3)}12%{filter:brightness(.6)}16%{filter:brightness(1.1)}70%{filter:brightness(1.2)}74%{filter:brightness(.7)}}.spot{animation:flick 5s infinite}';
document.head.appendChild(st);
// dust
const c=document.getElementById('c'),x=c.getContext('2d');let W,H;
function rs(){const r=c.getBoundingClientRect();W=c.width=r.width*devicePixelRatio;H=c.height=r.height*devicePixelRatio}
rs();addEventListener('resize',rs);
const P=Array.from({length:60},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.8+.4,vx:(Math.random()-.3)*.00015,vy:-Math.random()*.0003-.00005,a:Math.random()*6}));
function f(){x.clearRect(0,0,W,H);if(!reduce)for(const p of P){p.x+=p.vx;p.y+=p.vy;p.a+=.02;if(p.y<-.02){p.y=1.02;p.x=Math.random()}if(p.x>1.02)p.x=-.02;
x.beginPath();x.fillStyle='rgba(255,170,80,'+(.12+.3*Math.abs(Math.sin(p.a)))*(p.x>.5?1:.3)+')';x.arc(p.x*W,p.y*H,p.r*devicePixelRatio,0,7);x.fill()}requestAnimationFrame(f)}
f();
run();
</script>
</body>
</html>
